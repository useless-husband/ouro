name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stage 1
        run: make
      - name: Lint (clang -Wpedantic -Werror)
        run: make lint
      - name: Unit, regression and diagnostic tests
        run: make test
      - name: Three-stage bootstrap (stage 2 == stage 3)
        run: make bootstrap
      - name: c-testsuite
        run: make c-testsuite
  programs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Lua 5.4.7 and its test suite
        run: make lua
      - name: zlib 1.3.1
        run: make zlib
      - name: SQLite 3.50.4
        run: make sqlite
  sanitizers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression and ABI tests with ouro built under UBSan
        run: make sanitize
